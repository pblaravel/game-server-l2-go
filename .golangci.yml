# golangci-lint v2 — качество + границы слоёв DDD / FSD.
#
# Слои (стрелка = «может импортировать»):
#   cmd                         composition root → всё
#   internal/db                 infrastructure (реализует порты BC)
#   internal/loginserver        login bounded context
#   internal/gameserver         game bounded context
#   internal/clientapi          контракт клиента (лист)
#   internal/config             конфигурация (лист)
#   internal/{crypt,packet,session}  shared kernel (лист)
#   internal/apitest            тестовые хелперы (только cmd / тесты)
version: "2"

run:
  timeout: 5m
  relative-path-mode: cfg
  modules-download-mode: readonly
  go: "1.22"

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gomoddirectives
    - gosec
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - usetesting
    - wastedassign
    - whitespace

  settings:
    depguard:
      rules:
        deprecated:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/pkg/errors
              desc: use std errors / fmt.Errorf
            - pkg: github.com/golang/protobuf
              desc: use google.golang.org/protobuf
            - pkg: io/ioutil
              desc: ioutil is gone; use io and os
            - pkg: math/rand$
              desc: use math/rand/v2

        shared-kernel:
          list-mode: lax
          files:
            - "**/internal/crypt/**/*.go"
            - "**/internal/packet/**/*.go"
            - "**/internal/session/**/*.go"
          deny:
            - pkg: github.com/pblaravel/game-server-l2-go/internal/db
              desc: shared kernel must not import infrastructure
            - pkg: github.com/pblaravel/game-server-l2-go/internal/loginserver
              desc: shared kernel must not import a bounded context
            - pkg: github.com/pblaravel/game-server-l2-go/internal/gameserver
              desc: shared kernel must not import a bounded context
            - pkg: github.com/pblaravel/game-server-l2-go/internal/config
              desc: shared kernel must not import config
            - pkg: github.com/pblaravel/game-server-l2-go/internal/clientapi
              desc: shared kernel must not import the client contract catalog
            - pkg: github.com/pblaravel/game-server-l2-go/cmd
              desc: shared kernel must not import cmd
            - pkg: github.com/pblaravel/game-server-l2-go/internal/apitest
              desc: production code must not import test helpers

        config:
          list-mode: lax
          files:
            - "**/internal/config/**/*.go"
          deny:
            - pkg: github.com/pblaravel/game-server-l2-go/internal/db
              desc: config must not import infrastructure
            - pkg: github.com/pblaravel/game-server-l2-go/internal/loginserver
              desc: config must not import a bounded context
            - pkg: github.com/pblaravel/game-server-l2-go/internal/gameserver
              desc: config must not import a bounded context
            - pkg: github.com/pblaravel/game-server-l2-go/internal/clientapi
              desc: config must not import the client contract catalog
            - pkg: github.com/pblaravel/game-server-l2-go/cmd
              desc: config must not import cmd
            - pkg: github.com/pblaravel/game-server-l2-go/internal/apitest
              desc: config must not import test helpers

        login-bc:
          list-mode: lax
          files:
            - "**/internal/loginserver/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/pblaravel/game-server-l2-go/internal/gameserver
              desc: login BC must not import game BC
            - pkg: github.com/pblaravel/game-server-l2-go/internal/db
              desc: compose DB in cmd; login depends on AccountStore/GameServerStore ports
            - pkg: github.com/pblaravel/game-server-l2-go/internal/clientapi
              desc: login BC must not import the client contract catalog
            - pkg: github.com/pblaravel/game-server-l2-go/cmd
              desc: BC must not import composition root
            - pkg: github.com/pblaravel/game-server-l2-go/internal/apitest
              desc: production code must not import test helpers

        game-bc:
          list-mode: lax
          files:
            - "**/internal/gameserver/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/pblaravel/game-server-l2-go/internal/loginserver
              desc: game BC must not import login BC
            - pkg: github.com/pblaravel/game-server-l2-go/internal/db
              desc: compose DB in cmd; game depends on CharacterStore ports
            - pkg: github.com/pblaravel/game-server-l2-go/internal/clientapi
              desc: game BC must not import the client contract catalog
            - pkg: github.com/pblaravel/game-server-l2-go/cmd
              desc: BC must not import composition root
            - pkg: github.com/pblaravel/game-server-l2-go/internal/apitest
              desc: production code must not import test helpers

        infra:
          list-mode: lax
          files:
            - "**/internal/db/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/pblaravel/game-server-l2-go/cmd
              desc: infrastructure must not import composition root
            - pkg: github.com/pblaravel/game-server-l2-go/internal/apitest
              desc: infrastructure must not import test helpers
            - pkg: github.com/pblaravel/game-server-l2-go/internal/clientapi
              desc: infrastructure must not import the client contract catalog

        clientapi:
          list-mode: lax
          files:
            - "**/internal/clientapi/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/pblaravel/game-server-l2-go/internal/db
              desc: clientapi is a contract catalog, not persistence
            - pkg: github.com/pblaravel/game-server-l2-go/internal/loginserver
              desc: clientapi must stay independent of server internals
            - pkg: github.com/pblaravel/game-server-l2-go/internal/gameserver
              desc: clientapi must stay independent of server internals
            - pkg: github.com/pblaravel/game-server-l2-go/internal/config
              desc: clientapi must stay independent of config
            - pkg: github.com/pblaravel/game-server-l2-go/cmd
              desc: clientapi must not import cmd
            - pkg: github.com/pblaravel/game-server-l2-go/internal/apitest
              desc: clientapi must not import test helpers

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      disabled-checks:
        - commentFormatting
        - captLocal
        - elseif
        - wrapperFunc
        - unlambda
        - underef
        - unslice
        - ifElseChain
        - exitAfterDefer

    gosec:
      excludes:
        - G101 # default JDBC/properties passwords from the Java port
        - G109 # Atoi → int32 in datapack / protocol IDs
        - G114 # ListenAndServe is wrapped with timeouts in cmd
        - G115 # int conversion in protocol opcodes
        - G304 # file path from config (properties, datapack)
        - G306 # hexid perms are set explicitly
        - G403 # L2 login RSA is 512-bit by protocol
        - G404 # gameplay RNG is not cryptographic
        - G602 # geo cell neighbors are bounds-checked by the loop

    iface:
      enable:
        - identical
        - unused

    interfacebloat:
      max: 10

    nakedret:
      max-func-lines: 40

    revive:
      enable-default-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: waitgroup-by-value
        - name: empty-block
        - name: superfluous-else
        - name: import-shadowing
        - name: modifies-value-receiver
        - name: identical-branches
        - name: unnecessary-stmt
        - name: use-any
        - name: datarace
        - name: atomic
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: duplicated-imports
        - name: errorf
        - name: range-val-in-closure
        - name: string-of-int
        - name: unreachable-code

    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1008
        - -S1009
        - -S1016
        - -ST1000
        - -ST1003
        - -ST1016

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: internal/(gameserver|loginserver)/
        linters:
          - noctx
          - containedctx
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - containedctx
          - revive
          - staticcheck
      - path: cmd/
        linters:
          - noctx
      - path: internal/apitest/
        linters:
          - noctx
          - containedctx
    paths:
      - third_party$
      - builtin$
      - examples$
      - reference$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pblaravel/game-server-l2-go
  exclusions:
    generated: lax
    paths:
      - third_party$
      - reference$
