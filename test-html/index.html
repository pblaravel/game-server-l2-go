<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lineage II: The Chaotic Throne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="world" aria-hidden="true">
      <div class="sky"></div>
      <div class="stars"></div>
      <div class="moon"></div>
      <div class="clouds cloud-a"></div>
      <div class="clouds cloud-b"></div>
      <div class="haze"></div>
      <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a1714" />
            <stop offset="100%" stop-color="#0b0908" />
          </linearGradient>
          <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#12100e" />
            <stop offset="100%" stop-color="#050403" />
          </linearGradient>
          <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e8c56a" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#8a5a12" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path
          fill="url(#hillFar)"
          d="M0 760 C180 710 320 690 520 720 C740 760 860 640 1080 680 C1280 714 1420 640 1620 690 C1760 726 1860 710 1920 700 L1920 1080 L0 1080 Z"
        />
        <g class="castle castle-left" fill="#070605">
          <rect x="210" y="470" width="220" height="280" />
          <rect x="180" y="500" width="70" height="250" />
          <rect x="400" y="430" width="80" height="320" />
          <polygon points="170,500 215,420 260,500" />
          <polygon points="390,430 440,330 490,430" />
          <polygon points="200,470 320,390 440,470" />
          <rect x="300" y="360" width="36" height="140" />
          <polygon points="292,360 318,300 344,360" />
          <rect x="150" y="620" width="320" height="28" />
          <path d="M150 620 l16-22 h28 l16 22 h28 l16-22 h28 l16 22 h28 l16-22 h28 l16 22 h28 l16-22 h28 l16 22 v28 H150 Z" />
          <rect x="430" y="390" width="18" height="70" />
          <polygon points="426,390 439,350 452,390" />
        </g>
        <g fill="url(#windowGlow)">
          <rect x="236" y="530" width="14" height="26" rx="2" />
          <rect x="272" y="530" width="14" height="26" rx="2" />
          <rect x="308" y="530" width="14" height="26" rx="2" />
          <rect x="344" y="530" width="14" height="26" rx="2" />
          <rect x="236" y="580" width="14" height="26" rx="2" />
          <rect x="344" y="580" width="14" height="26" rx="2" />
          <rect x="418" y="500" width="16" height="32" rx="2" />
        </g>
        <g class="castle castle-right" fill="#060504">
          <rect x="1320" y="430" width="280" height="340" />
          <rect x="1260" y="500" width="90" height="270" />
          <rect x="1570" y="380" width="90" height="390" />
          <polygon points="1248,500 1305,400 1362,500" />
          <polygon points="1558,380 1615,250 1672,380" />
          <rect x="1420" y="300" width="48" height="180" />
          <polygon points="1410,300 1444,220 1478,300" />
          <rect x="1488" y="340" width="28" height="130" />
          <polygon points="1482,340 1502,290 1522,340" />
          <rect x="1240" y="650" width="430" height="32" />
          <path d="M1240 650 l18-24 h30 l18 24 h30 l18-24 h30 l18 24 h30 l18-24 h30 l18 24 h30 l18-24 h30 l18 24 h30 l18-24 h30 l18 24 v32 H1240 Z" />
          <rect x="1600" y="300" width="20" height="90" />
          <polygon points="1594,300 1610,250 1626,300" />
        </g>
        <g fill="url(#windowGlow)">
          <rect x="1370" y="500" width="16" height="30" rx="2" />
          <rect x="1418" y="500" width="16" height="30" rx="2" />
          <rect x="1466" y="500" width="16" height="30" rx="2" />
          <rect x="1514" y="500" width="16" height="30" rx="2" />
          <rect x="1370" y="560" width="16" height="30" rx="2" />
          <rect x="1514" y="560" width="16" height="30" rx="2" />
          <rect x="1594" y="450" width="18" height="36" rx="2" />
          <rect x="1430" y="360" width="14" height="28" rx="2" />
        </g>
        <path
          fill="url(#hillNear)"
          d="M0 860 C260 800 480 900 760 840 C1040 780 1200 900 1480 850 C1680 814 1820 840 1920 820 L1920 1080 L0 1080 Z"
        />
      </svg>
      <div class="fog"></div>
      <div class="vignette"></div>
    </div>

    <header class="brand">
      <p class="brand-title">LINEAGE <span>II</span></p>
      <p class="brand-sub">The Chaotic Throne</p>
    </header>

    <main class="stage">
      <section class="panel" id="auth-panel" aria-labelledby="panel-title">
        <div class="panel-frame" aria-hidden="true">
          <svg class="corner corner-tl" viewBox="0 0 72 72">
            <path d="M4 68 V18 Q4 4 18 4 H68" fill="none" stroke="#d4af37" stroke-width="1.6" />
            <path d="M14 4 L4 14 M22 4 L4 22" stroke="#c9a227" stroke-width="1" />
            <polygon points="4,4 16,4 4,16" fill="#e6c65a" />
          </svg>
          <svg class="corner corner-tr" viewBox="0 0 72 72">
            <path d="M68 68 V18 Q68 4 54 4 H4" fill="none" stroke="#d4af37" stroke-width="1.6" />
            <path d="M58 4 L68 14 M50 4 L68 22" stroke="#c9a227" stroke-width="1" />
            <polygon points="68,4 56,4 68,16" fill="#e6c65a" />
          </svg>
          <svg class="corner corner-bl" viewBox="0 0 72 72">
            <path d="M4 4 V54 Q4 68 18 68 H68" fill="none" stroke="#d4af37" stroke-width="1.6" />
            <path d="M14 68 L4 58 M22 68 L4 50" stroke="#c9a227" stroke-width="1" />
            <polygon points="4,68 16,68 4,56" fill="#e6c65a" />
          </svg>
          <svg class="corner corner-br" viewBox="0 0 72 72">
            <path d="M68 4 V54 Q68 68 54 68 H4" fill="none" stroke="#d4af37" stroke-width="1.6" />
            <path d="M58 68 L68 58 M50 68 L68 50" stroke="#c9a227" stroke-width="1" />
            <polygon points="68,68 56,68 68,56" fill="#e6c65a" />
          </svg>
        </div>

        <div class="crest" aria-hidden="true">
          <svg viewBox="0 0 86 96">
            <defs>
              <linearGradient id="goldMetal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f8e7a2" />
                <stop offset="42%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#8a6a14" />
              </linearGradient>
            </defs>
            <path
              d="M43 6 L78 20 V48 C78 72 60 86 43 92 C26 86 8 72 8 48 V20 Z"
              fill="url(#goldMetal)"
              stroke="#f3e0a6"
              stroke-width="1.4"
            />
            <path
              d="M43 16 L68 26 V47 C68 66 54 78 43 83 C32 78 18 66 18 47 V26 Z"
              fill="#1a140c"
              stroke="#c9a227"
              stroke-width="1"
            />
            <path d="M43 24 L54 56 H32 Z" fill="#d4af37" />
            <circle cx="43" cy="62" r="6" fill="#e6c65a" />
          </svg>
        </div>

        <div class="lang" id="lang-wrap">
          <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
              <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.4" />
              <path d="M3 12h18M5 7.5h14M5 16.5h14" fill="none" stroke="currentColor" stroke-width="1.4" />
            </svg>
            <span data-i18n="langName">Русский</span>
            <span class="caret">▾</span>
          </button>
          <ul class="lang-menu" id="lang-menu" role="listbox" hidden>
            <li><button type="button" data-lang="ru" role="option">Русский</button></li>
            <li><button type="button" data-lang="en" role="option">English</button></li>
          </ul>
        </div>

        <h1 class="panel-title" id="panel-title" data-i18n="loginTitle">ВХОД В ИГРУ</h1>

        <form id="login-form" class="form" data-screen="login" novalidate>
          <label class="field">
            <span class="sr-only" data-i18n="login">Логин</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M5 19c1.4-3.4 4-5 7-5s5.6 1.6 7 5" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input id="login-input" name="login" type="text" autocomplete="username" data-i18n-placeholder="login" placeholder="Логин" />
          </label>
          <label class="field">
            <span class="sr-only" data-i18n="password">Пароль</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="11" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input id="password-input" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="password" placeholder="Пароль" />
            <button class="icon-btn" id="toggle-password" type="button" aria-label="Показать пароль">
              <svg class="icon-eye" viewBox="0 0 24 24">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.7" />
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" hidden>
                <path d="M3 3l18 18M9.9 9.9A3 3 0 0 0 14 14M6.1 6.1C3.7 7.8 2 12 2 12s4 7 10 7c1.8 0 3.4-.5 4.8-1.3M17.9 17.9C20.3 16.2 22 12 22 12s-4-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.7" />
              </svg>
            </button>
          </label>
          <div class="form-row">
            <label class="check">
              <input type="checkbox" id="remember" />
              <span class="box" aria-hidden="true"></span>
              <span data-i18n="remember">Запомнить меня</span>
            </label>
            <button class="link" id="forgot-link" type="button" data-i18n="forgot">Забыли пароль?</button>
          </div>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="btn btn-gold" type="submit" data-i18n="enter">ВОЙТИ</button>
        </form>

        <form id="register-form" class="form" data-screen="register" hidden novalidate>
          <label class="field">
            <span class="sr-only" data-i18n="login">Логин</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M5 19c1.4-3.4 4-5 7-5s5.6 1.6 7 5" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input name="login" type="text" autocomplete="username" data-i18n-placeholder="login" placeholder="Логин" />
          </label>
          <label class="field">
            <span class="sr-only" data-i18n="email">Email</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input name="email" type="email" autocomplete="email" data-i18n-placeholder="email" placeholder="Email" />
          </label>
          <label class="field">
            <span class="sr-only" data-i18n="password">Пароль</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="11" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input name="password" type="password" autocomplete="new-password" data-i18n-placeholder="password" placeholder="Пароль" />
          </label>
          <label class="field">
            <span class="sr-only" data-i18n="passwordRepeat">Повторите пароль</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="11" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input name="passwordRepeat" type="password" autocomplete="new-password" data-i18n-placeholder="passwordRepeat" placeholder="Повторите пароль" />
          </label>
          <p class="form-error" id="register-error" role="alert" hidden></p>
          <button class="btn btn-gold" type="submit" data-i18n="createAccount">СОЗДАТЬ АККАУНТ</button>
        </form>

        <form id="forgot-form" class="form" data-screen="forgot" hidden novalidate>
          <p class="hint" data-i18n="forgotHint">Укажите email — отправим ссылку для сброса пароля.</p>
          <label class="field">
            <span class="sr-only" data-i18n="email">Email</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
            <input name="email" type="email" autocomplete="email" data-i18n-placeholder="email" placeholder="Email" />
          </label>
          <p class="form-error" id="forgot-error" role="alert" hidden></p>
          <button class="btn btn-gold" type="submit" data-i18n="sendLink">ОТПРАВИТЬ</button>
        </form>

        <div id="success-screen" class="success" data-screen="success" hidden>
          <p class="success-kicker" data-i18n="welcome">Добро пожаловать</p>
          <p class="success-name" id="welcome-name"></p>
          <p class="hint" data-i18n="serverReady">Сервер готов к подключению.</p>
          <button class="btn btn-gold" id="enter-world" type="button" data-i18n="enterWorld">В ИГРУ</button>
          <button class="btn btn-ghost" id="logout-btn" type="button" data-i18n="logout">ВЫЙТИ</button>
        </div>

        <div class="divider" id="or-divider">
          <span data-i18n="or">ИЛИ</span>
        </div>
        <button class="btn btn-ghost" id="switch-mode" type="button" data-i18n="register">РЕГИСТРАЦИЯ</button>
      </section>
    </main>

    <div class="overlay" id="overlay" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <button class="sheet-close" id="sheet-close" type="button" aria-label="Закрыть">×</button>
        <h2 id="sheet-title"></h2>
        <div id="sheet-body"></div>
      </section>
    </div>

    <nav class="footer" aria-label="Навигация">
      <button type="button" data-open="site">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20H15v-5H9v5H4Z" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
        <span data-i18n="site">САЙТ</span>
      </button>
      <button type="button" data-open="forum">
        <svg viewBox="0 0 24 24"><path d="M5 6h14v10H8l-3 3V6Z" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
        <span data-i18n="forum">ФОРУМ</span>
      </button>
      <button type="button" data-open="support">
        <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 14 0v4a2 2 0 0 1-2 2h-1v-6h3M5 12v4a2 2 0 0 0 2 2h1v-6H5" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
        <span data-i18n="support">ПОДДЕРЖКА</span>
      </button>
      <button type="button" data-open="settings">
        <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M12 3.5v2.2M12 18.3V20.5M4.9 7.2l1.9 1.1M17.2 15.7l1.9 1.1M4.9 16.8l1.9-1.1M17.2 8.3l1.9-1.1" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
        <span data-i18n="settings">НАСТРОЙКИ</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
