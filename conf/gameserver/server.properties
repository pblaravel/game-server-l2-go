GameserverHostname = *
GameserverPort = 7778
LoginHost = 127.0.0.1
LoginPort = 9015
RequestServerID = 1
AcceptAlternateID = true
MaximumOnlineUsers = 100
UseBlowfishCipher = true
AllowedProtocolVersions = 737,740,744,746
# Unity client sends ProtocolVersion then expects VersionCheck. Unknown versions
# are accepted and logged unless StrictProtocol is true (Java closes the socket).
StrictProtocol = false
ServerGMOnly = false
Developer = false
PacketHandlerDebug = true
logger.print.received-packets = true
logger.print.sent-packets = true
database.url = postgres://l2unity:l2unity@localhost:5432/l2unity?sslmode=disable
